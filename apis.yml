  properties:
  - url: https://lingo.dev/en/compiler
    type: Documentation
  - url: https://github.com/lingodotdev/lingo.dev
    type: SourceCode
  description: >-
    Open-source build-time React localization. The Compiler detects translatable strings and generates
    localized variants at build time without i18n wrappers, translation keys, or t() function calls, using
    the same localization engine behind the scenes.
