name: Lingo.dev
kind: company
description: Lingo.dev (formerly Replexica) is an AI localization platform for
  software teams. Its hosted Localization Engine exposes a Bearer/X-API-Key REST
  API and SDK for translating text, objects, chat messages, HTML, and string
  arrays while preserving structure, brand voice, and glossaries. Open-source
  tooling - the CLI and the build-time React Compiler - sits on top of the same
  engine.
