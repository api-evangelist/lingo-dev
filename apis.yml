  properties:
  - url: https://lingo.dev/en/cli/quick-start
    type: Documentation
  - url: https://github.com/lingodotdev/lingo.dev
    type: SourceCode
  description: >-
    Open-source command-line tool that localizes JSON, YAML, Markdown, CSV, and PO files in one command,
    tracking a lockfile so only new or changed content is processed. Connects to the Lingo.dev engine
    by default and can bring your own LLM (OpenAI, Anthropic, Google, Mistral, OpenRouter, Ollama).
- aid: lingo-dev:compiler
  name: Lingo.dev Compiler
  tags:
  - Compiler
  - React
  - Open-Source
  - Build-time
  tags_raw:
  - Compiler
  - React
  - Open Source
