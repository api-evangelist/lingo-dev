description: >-
  FinOps view of Lingo.dev spend. Lingo.dev bills a monthly subscription per
  tier that bundles a translated-word allotment, plus metered overage per
  additional 1,000 translated words. Internally the engine accounts usage in
  tokens (roughly 1.3 tokens per English word, with configuration multipliers
  on input and language expansion on output), but invoices are denominated in
  translated words. The CLI, Compiler, and SDK are open source; engine usage is
  the billable component.
notes: >-
  Per-tier word allotments and overage rates are subject to change; verify
  against the Lingo.dev pricing page during reconciliation.
sources:
- https://lingo.dev/en/pricing
