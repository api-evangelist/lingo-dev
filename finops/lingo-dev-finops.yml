meters:
- name: subscription_fee
  description: Recurring monthly subscription fee per plan tier (Pro, Team).
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: included_words
  description: Translated words consumed within the plan's monthly allotment.
  unit: words
  aggregation: sum
  dimensions:
  - account
  - plan
  - project
- name: overage_words
  description: Translated words above the plan allotment, billed per 1,000 words.
  unit: words
  aggregation: sum
  dimensions:
  - account
  - plan
  - project
- name: engine_tokens
  description: Internal token accounting (~1.3 tokens per English word) underlying word billing.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - project
  - locale
principles:
- name: Visibility
  description: Track translated-word burn per project and locale in the dashboard; map to plan allotment.
- name: Allocation
  description: Scope API keys per project/team and tag jobs so word spend maps to internal cost centers.
- name: Optimization
  description: Use the CLI lockfile so only new or changed content is re-localized; right-size the plan tier to actual word volume; consider bring-your-own-LLM in the CLI for cost-sensitive workloads.
- name: Accountability
  description: Assign owners per project/key; review translated-word usage monthly against allotment and overage budget.
